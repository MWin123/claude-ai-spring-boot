name: Claude files

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push cancels the older run. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: shellcheck setup.sh
      - name: Run pytest
        id: pytest
        # md-report writes the per-file table to the run page's summary. Keep the "=": as a separate
        # argument the existing summary file counts as a test path and pytest loses its rootdir.
        run: >-
          pytest -v --emoji --color=yes
          --md-report --md-report-output="$GITHUB_STEP_SUMMARY"
          --junit-xml "$RUNNER_TEMP/pytest-junit.xml"
        env:
          FORCE_COLOR: "1" # colors for pytest-pretty (rich)
          PY_COLORS: "0" # but plain failure text in the JUnit XML for the summary
          COLUMNS: "120"
      # Adds a count badge to the summary and, on failure, the failed tests with their traceback.
      - name: Test summary
        if: always() && steps.pytest.outcome != 'skipped'
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: ${{ runner.temp }}/pytest-junit.xml
          show: fail
